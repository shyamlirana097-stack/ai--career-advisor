name: Weekly RAG Refresh

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run chunking
        run: python scripts/chunk_documents.py

      - name: Run embedding + storage
        run: python scripts/embed_and_store.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add data/processed/chunks.json
          git commit -m "Automated weekly refresh" || echo "No changes to commit"
          git push
          